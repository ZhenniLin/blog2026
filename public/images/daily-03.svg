<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="300" height="300" shape-rendering="crispEdges" role="img" aria-label="像素风：画架上的油画">
  <rect width="32" height="32" fill="#fdf4e4"/>
  <!-- 画架支腿 -->
  <rect x="8" y="20" width="2" height="10" fill="#ca6702"/>
  <rect x="22" y="20" width="2" height="10" fill="#ca6702"/>
  <rect x="6" y="29" width="20" height="2" fill="#ca6702"/>
  <!-- 画布 -->
  <rect x="5" y="4" width="22" height="17" fill="#ca6702"/>
  <rect x="6" y="5" width="20" height="15" fill="#fffaf2"/>
  <!-- 画面：日落 -->
  <rect x="6" y="5" width="20" height="7" fill="#ee9b00"/>
  <rect x="6" y="12" width="20" height="8" fill="#94d2bd"/>
  <rect x="16" y="8" width="4" height="4" fill="#ca6702"/>
  <rect x="6" y="16" width="20" height="1" fill="#fffaf2"/>
  <!-- 画笔 -->
  <rect x="27" y="22" width="1" height="8" fill="#ee9b00"/>
  <rect x="27" y="21" width="1" height="2" fill="#ca6702"/>
</svg>
